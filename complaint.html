```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Complaint | SafeConnect</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="login-page">

<div class="login-ai">

<div class="ai-logo">
<i class="fa-solid fa-file-circle-exclamation"></i>
</div>

<h1>
Report a
<span>Complaint</span>
</h1>

<p>
SafeConnect AI will analyze your complaint and route it to the appropriate authority.
</p>

<div class="security-item">
<i class="fa-solid fa-robot"></i>
AI Complaint Analysis
</div>

<div class="security-item">
<i class="fa-solid fa-route"></i>
Smart Authority Routing
</div>

<div class="security-item">
<i class="fa-solid fa-shield-heart"></i>
Secure Complaint Tracking
</div>

</div>


<div class="login-card">

<h2>Report Complaint</h2>

<p>Describe your issue clearly</p>

<form id="complaintForm">

<div class="input-box">

<i class="fa-solid fa-heading"></i>

<input
id="title"
type="text"
placeholder="Complaint Title"
required>

</div>


<div class="input-box">

<i class="fa-solid fa-location-dot"></i>

<input
id="location"
type="text"
placeholder="Location"
required>

</div>


<div class="input-box" style="height:140px;">

<i class="fa-solid fa-align-left"></i>

<textarea
id="description"
placeholder="Describe your complaint..."
required
style="width:100%; height:120px; border:none; outline:none; background:transparent; font-family:Poppins; resize:none;"></textarea>

</div>


<button type="submit" class="login-submit">

<i class="fa-solid fa-paper-plane"></i>
Submit Complaint

</button>


<p id="complaintMessage"
style="text-align:center; margin-top:15px;">
</p>


<p class="register-text">

<a href="dashboard.html">
<i class="fa-solid fa-arrow-left"></i>
Back to Dashboard
</a>

</p>

</form>

</div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";

const token = localStorage.getItem("safeconnect_token");

const complaintForm =
document.getElementById("complaintForm");

const complaintMessage =
document.getElementById("complaintMessage");


// Check login

if (!token) {

    window.location.href = "login.html";

}


// Submit complaint

complaintForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const title =
        document.getElementById("title").value;

    const description =
        document.getElementById("description").value;

    const location =
        document.getElementById("location").value;


    complaintMessage.textContent =
        "SafeConnect AI is analyzing your complaint...";


    try {

        const response = await fetch(
            `${API_URL}/complaints/`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({

                    title: title,

                    description: description,

                    location: location

                })

            }
        );


        const data = await response.json();


        if (!response.ok) {

            complaintMessage.textContent =
                data.detail || "Complaint submission failed.";

            return;

        }


        complaintMessage.innerHTML =
            "Complaint submitted successfully!<br>" +
            "AI Category: " + (data.ai_category || data.category) +
            "<br>" +
            "Priority: " + data.priority +
            "<br>" +
            "Authority: " + data.authority;


        complaintForm.reset();


    } catch (error) {

        console.error(error);

        complaintMessage.textContent =
            "Cannot connect to SafeConnect backend.";

    }

});

</script>

</body>

</html>
```
