```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency SOS | SafeConnect</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

.sos-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.sos-card {
    width: 100%;
    max-width: 600px;
    text-align: center;
    padding: 45px 30px;
}

.sos-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.sos-card h1 {
    margin-bottom: 10px;
}

.sos-card p {
    margin-bottom: 25px;
}


/* =========================
   ANIMATED SOS BUTTON
   ========================= */

.sos-button {
    position: relative;

    width: 210px;
    height: 210px;

    border-radius: 50%;
    border: none;

    background: #e53935;
    color: white;

    font-size: 30px;
    font-weight: 700;

    cursor: pointer;

    z-index: 2;

    box-shadow:
        0 0 0 0 rgba(229, 57, 53, 0.7),
        0 15px 35px rgba(0, 0, 0, 0.25);

    animation: sosPulse 1.5s infinite;

    transition: transform 0.2s;
}


/* Expanding red alert rings */

.sos-button::before,
.sos-button::after {

    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid rgba(229, 57, 53, 0.6);

    z-index: -1;

    animation: sosRing 1.8s infinite;
}


.sos-button::after {
    animation-delay: 0.9s;
}


/* Hover */

.sos-button:hover {
    transform: scale(1.08);
}


/* Click */

.sos-button:active {
    transform: scale(0.95);
}


/* Bell */

.sos-button i {

    display: block;

    font-size: 55px;

    margin-bottom: 10px;

    animation: bellShake 0.8s infinite;
}


/* =========================
   SOS PULSE ANIMATION
   ========================= */

@keyframes sosPulse {

    0% {

        box-shadow:
            0 0 0 0 rgba(229, 57, 53, 0.7),
            0 15px 35px rgba(0, 0, 0, 0.25);

    }

    50% {

        box-shadow:
            0 0 0 25px rgba(229, 57, 53, 0.15),
            0 18px 40px rgba(0, 0, 0, 0.30);

    }

    100% {

        box-shadow:
            0 0 0 55px rgba(229, 57, 53, 0),
            0 15px 35px rgba(0, 0, 0, 0.25);

    }

}


/* =========================
   RED ALERT RING
   ========================= */

@keyframes sosRing {

    0% {

        width: 100%;
        height: 100%;
        opacity: 0.8;

    }

    100% {

        width: 175%;
        height: 175%;
        opacity: 0;

    }

}


/* =========================
   BELL SHAKE
   ========================= */

@keyframes bellShake {

    0% {
        transform: rotate(0deg);
    }

    20% {
        transform: rotate(-12deg);
    }

    40% {
        transform: rotate(12deg);
    }

    60% {
        transform: rotate(-8deg);
    }

    80% {
        transform: rotate(8deg);
    }

    100% {
        transform: rotate(0deg);
    }

}


/* =========================
   MESSAGE BOX
   ========================= */

.sos-message-box {
    margin-top: 30px;
}

.sos-message-box textarea {

    width: 90%;
    max-width: 500px;

    padding: 14px;

    border-radius: 12px;

    border: 1px solid #ccc;

    resize: none;

    font-family: Poppins, sans-serif;

}


/* =========================
   STATUS
   ========================= */

#sosStatus {

    margin-top: 25px;

    font-weight: 600;

}

</style>

</head>


<body>


<div class="sos-page">

<div class="dash-card sos-card">


<a href="dashboard.html"
class="back-home"
style="display:inline-block; margin-bottom:25px;">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>


<div class="sos-icon">

<i class="fa-solid fa-shield-heart"></i>

</div>


<h1>
Emergency SOS
</h1>


<p>

Press the SOS button to send your current location
to SafeConnect emergency services.

</p>


<button
id="sosButton"
class="sos-button"
type="button"
>

<i class="fa-solid fa-bell"></i>

SOS

</button>


<div class="sos-message-box">


<textarea
id="sosMessage"
rows="3"
placeholder="Optional: Add an emergency message..."
></textarea>


</div>


<p id="sosStatus"></p>


</div>

</div>


<script>


const API_URL = "http://127.0.0.1:8000";


const token =
    localStorage.getItem("safeconnect_token");


const sosButton =
    document.getElementById("sosButton");


const sosStatus =
    document.getElementById("sosStatus");


// Check login

if (!token) {

    window.location.href = "login.html";

}


// SOS button

sosButton.addEventListener("click", function() {


    sosStatus.textContent =
        "Getting your current location...";


    if (!navigator.geolocation) {

        sosStatus.textContent =
            "Location services are not supported by this browser.";

        return;

    }


    navigator.geolocation.getCurrentPosition(


        async function(position) {


            const latitude =
                position.coords.latitude;


            const longitude =
                position.coords.longitude;


            const message =
                document.getElementById("sosMessage")
                .value
                .trim()
                || "Emergency assistance required.";


            sosStatus.textContent =
                "Sending emergency SOS...";


            try {


                const response =
                    await fetch(

                        `${API_URL}/emergency/sos`,

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`

                            },

                            body: JSON.stringify({

                                latitude: latitude,

                                longitude: longitude,

                                message: message

                            })

                        }

                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    sosStatus.textContent =
                        data.detail ||
                        "Unable to send emergency SOS.";

                    return;

                }


                sosStatus.textContent =
                    "✓ Emergency SOS sent successfully!";


                console.log(
                    "SOS response:",
                    data
                );


            }


            catch (error) {


                console.error(
                    "SOS error:",
                    error
                );


                sosStatus.textContent =
                    "Cannot connect to SafeConnect backend.";

            }


        },


        function(error) {


            console.error(
                "Location error:",
                error
            );


            sosStatus.textContent =
                "Please allow location access in Chrome.";

        }


    );


});


</script>


</body>

</html>
```
