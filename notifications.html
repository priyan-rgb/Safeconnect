<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | SafeConnect</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="dashboard-page">

<a href="dashboard.html" class="back-home">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>

<div class="dashboard-title">

<h1>
<i class="fa-solid fa-bell"></i>
Notifications
</h1>

<p>
Stay updated with your SafeConnect activity
</p>

</div>

<div id="notificationsContainer">

<p style="text-align:center;">
Loading notifications...
</p>

</div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";

const token = localStorage.getItem("safeconnect_token");

if (!token) {

    window.location.href = "login.html";

}


async function loadNotifications() {

    const container =
        document.getElementById("notificationsContainer");

    try {

        const response = await fetch(
            `${API_URL}/notifications/`,
            {
                method: "GET",

                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            }
        );


        if (!response.ok) {

            const errorText = await response.text();

            console.error(
                "Notifications API Error:",
                response.status,
                errorText
            );

            container.innerHTML = `
                <div class="dash-card">
                    <h2>
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        Unable to load notifications
                    </h2>

                    <p>
                        Backend returned status ${response.status}.
                    </p>
                </div>
            `;

            return;

        }


        const data = await response.json();

        console.log("Notifications API Response:", data);


        /*
         * Support both possible backend response formats:
         *
         * 1. Direct array:
         * [
         *   {...},
         *   {...}
         * ]
         *
         * 2. Object containing notifications:
         * {
         *   "notifications": [...]
         * }
         */

        let notifications = [];

        if (Array.isArray(data)) {

            notifications = data;

        } else if (Array.isArray(data.notifications)) {

            notifications = data.notifications;

        }


        if (notifications.length === 0) {

            container.innerHTML = `
                <div class="dash-card">
                    <h2>
                        <i class="fa-solid fa-bell-slash"></i>
                        No Notifications
                    </h2>

                    <p>
                        You don't have any notifications yet.
                    </p>
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        notifications.forEach(function(notification) {

            const card =
                document.createElement("div");

            card.className = "dash-card";

            card.style.marginBottom = "20px";


            const isRead =
                notification.is_read === "true" ||
                notification.is_read === true;


            card.innerHTML = `

                <h2>
                    <i class="fa-solid fa-bell"></i>
                    ${notification.title || "Notification"}
                </h2>

                <p>
                    ${notification.message || ""}
                </p>

                <p>
                    <strong>Type:</strong>
                    ${notification.notification_type || "General"}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${isRead ? "Read" : "Unread"}
                </p>

                ${
                    !isRead
                    ?
                    `<button
                        onclick="markAsRead(${notification.id})"
                        class="primary">
                        <i class="fa-solid fa-check"></i>
                        Mark as Read
                    </button>`
                    :
                    ""
                }

            `;


            container.appendChild(card);

        });

    }

    catch (error) {

        console.error(
            "Cannot connect to SafeConnect backend:",
            error
        );

        container.innerHTML = `
            <div class="dash-card">

                <h2>
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Cannot Connect
                </h2>

                <p>
                    Cannot connect to SafeConnect backend.
                </p>

                <button
                    onclick="loadNotifications()"
                    class="primary">
                    <i class="fa-solid fa-rotate-right"></i>
                    Try Again
                </button>

            </div>
        `;

    }

}


async function markAsRead(notificationId) {

    try {

        const response = await fetch(
            `${API_URL}/notifications/${notificationId}/read`,
            {
                method: "PUT",

                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            }
        );


        if (!response.ok) {

            console.error(
                "Failed to mark notification as read:",
                response.status
            );

            return;

        }


        await loadNotifications();

    }

    catch (error) {

        console.error(
            "Mark as read error:",
            error
        );

    }

}


loadNotifications();

</script>

</body>

</html>
