```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | SafeConnect</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="register-page">

<div class="register-card">

<div class="register-icon">
<i class="fa-solid fa-user-plus"></i>
</div>

<h1>Create Account</h1>

<p>Join SafeConnect AI Safety Network</p>

<form id="registerForm">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
id="fullName"
type="text"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
id="email"
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
id="phone"
type="tel"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
id="password"
type="password"
placeholder="Create Password"
required>

</div>

<button type="submit" class="register-submit">
Create Account
</button>

<p id="registerMessage" style="text-align:center; margin-top:15px;"></p>

<p class="login-link">

Already registered?

<a href="login.html">
Login
</a>

</p>

</form>

</div>

<div class="register-side">

<h2>Become Protected With AI</h2>

<p>
Access emergency SOS,
legal assistance and smart grievance solutions.
</p>

<div class="feature-mini">

<i class="fa-solid fa-shield-heart"></i>

Smart Protection

</div>

<div class="feature-mini">

<i class="fa-solid fa-robot"></i>

AI Support

</div>

<div class="feature-mini">

<i class="fa-solid fa-location-dot"></i>

Live Safety Tracking

</div>

</div>

</div>

<script>

const API_URL = "http://127.0.0.1:8000";

const registerForm = document.getElementById("registerForm");
const registerMessage = document.getElementById("registerMessage");

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    registerMessage.textContent = "Creating account...";

    try {

        const response = await fetch(
            `${API_URL}/users/register`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    full_name: fullName,
                    email: email,
                    phone: phone,
                    password: password,
                    role: "citizen"
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            registerMessage.textContent =
                data.detail || "Registration failed.";

            return;
        }

        registerMessage.textContent =
            "Account created successfully!";

        setTimeout(function() {

            window.location.href = "login.html";

        }, 1000);

    } catch (error) {

        console.error(error);

        registerMessage.textContent =
            "Cannot connect to SafeConnect backend.";

    }

});

</script>

</body>

</html>
```
